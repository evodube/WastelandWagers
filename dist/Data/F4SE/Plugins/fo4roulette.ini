; Real Roulette (fo4roulette) settings. Every key is also on the mod's pages in the F4SE Menu Framework menu.
; Keys are Windows virtual-key codes (0x31 = 1, 0x58 = X, 0x61 = Numpad 1); 0 = none.

[Table]
iWheel=0                ; 0 European (single 0), 1 American (0 and 00)
bRequireDealer=0        ; 1: no spinning without a dealer at the table
iMaxBet=500             ; caps on one bet
fActiveDistance=3000    ; the dealer and NPCs come to a roulette table this close to you

[Camera]
fLayoutHeight=115       ; the view over the layout, above the felt
fWheelHeight=70         ; the view over the wheel
bWheelViewOnSpin=1      ; watch the wheel while the ball goes round
fCursorSpeed=0.07       ; cursor movement per bit of mouse movement

[Dealer]
fWalkTimeout=30         ; seconds to get to the table before they're put there
bWatchBall=1            ; the dealer's eyes follow the ball

[Bettors]
bEnabled=1              ; settlers come over and bet
iMax=3                  ; at most this many at once
fEvery=12               ; seconds between looking for someone
fRange=1500             ; how far from the table they come from
iMinRounds=2
iMaxRounds=6
fAutoSpin=20            ; with you away from the table, the dealer spins for them after this long

[HUD]
fScale=1.0
bNotifications=0        ; results as the game's corner messages too

[Sound]
bEnabled=1
fVolume=0.8

[Keys]
iSpin=0                 ; 0 = the game's activate key
iLeave=0x58             ; X
iView=0x56              ; V: the layout or the wheel
iRebet=0x42             ; B: last round's bets again
iClear=0x43             ; C: take your chips back
iChip1=0x31             ; 1
iChip5=0x32             ; 2
iChip25=0x33            ; 3
iChip100=0x34           ; 4
iDealer=0x61            ; Numpad 1: the settler you're looking at deals at the nearest table (again: stops)

[Forms]
sPlugin=fo4roulette.esl
