; Wasteland Wagers settings. Every key is also on the mod's pages in the F4SE Menu Framework menu.
; Keys are Windows virtual-key codes (0x31 = 1, 0x58 = X); 0 = none.
; What you change in the menu is saved to WastelandWagers_user.ini beside this file, and read first: a new version's WastelandWagers.ini
; doesn't undo it (delete that file to go back to these).

[Table]
iWheel=1                ; 0 European (single 0), 1 American (0 and 00)
fSpinDelay=15           ; the wheel spins itself this many seconds after the round's first bet
iMaxBet=500             ; caps on one bet
fActiveDistance=3000    ; NPCs come to a roulette table this close to you
bPauseOnOverlay=1       ; the Steam overlay (Shift+Tab) pauses the game: its pause menu opens with it, closes after
fLuck=1.0               ; how much your Luck (SPECIAL) tilts every game your way: 0 not at all, 1 as made, up to 3

[Income]
bIncome=1               ; settlers gambling at a table built in a settlement: the house's take goes to its workbench
fShare=100              ; ...this much of it (%): what the house wins from settlers, less what it pays out to them
iPokerRake=10           ; poker has no house: the card room takes this cut (%) of what a settler leaves the table up
bAway=1                 ; with you away from a settlement its tables still earn, by how many settlers live there
fAwayPerSettler=2.0     ; caps a game day, for each table, for each settler living there (a slot machine half)

[Camera]
fLayoutHeight=98        ; the view over the layout, above the felt
fWheelHeight=60         ; the view over the wheel
bWheelViewOnSpin=1      ; watch the wheel while the ball goes round
fCursorSpeed=0.07       ; cursor movement per bit of mouse movement

[Bettors]
bEnabled=1              ; settlers come over and bet
iMax=4                  ; at most this many at once (up to 4: two each side)
bIdles=1                ; they look the layout over, reach in to bet, cheer or shake their heads at the result
fEvery=12               ; seconds between looking for someone
fRange=1500             ; how far from the table they come from
iMinRounds=2
iMaxRounds=6

[Poker]
iSmallBlind=5           ; the blinds
iBigBlind=10
iBuyIn=500              ; the most of your caps you sit down with (the rest stay in your pocket)
bSettlers=1             ; settlers come and sit in, with their own caps
iMaxSettlers=5          ; at most this many at once (up to 6: seven seats)
iSettlerBuyIn=300       ; the most a settler sits down with
fThinkTime=1.0          ; how long settlers take to act (x)
bChairs=1               ; chairs round the poker table, and settlers sit in them
bCardsFaceDown=0        ; your cards face down, on the table and the HUD, till you show them (SHOW MY CARDS, looking at them, right mouse)
bVoices=1               ; settlers cheer, laugh and groan when they win and lose, at every table (the game's own lines)
bBanter=1               ; table talk: settlers who remember you greet you when they sit back in
bTopDown=0              ; start looking down on the table instead of from your seat (V switches at the table)
fTopHeight=108          ; how high that view is over the felt
fTopShift=0             ; ...and how far it's moved from the middle of the table towards your side
fSeatBack=42            ; the view from your seat: how far behind your cards
fSeatHeight=46          ; ...how high over the felt
fSeatAim=30             ; ...how far in front of your cards it looks

[Blackjack]
bChairs=1               ; chairs round the blackjack table, and settlers sit in them

[Slots]
bSettlers=1             ; settlers sit down at slot machines and play them with their own caps
iMaxSettlers=3          ; at most this many at once

[HUD]
fScale=0.9             ; 1.0 = the smallest that reads well at 1080p; bigger on top of that
bNotifications=0        ; results as the game's corner messages too

[Sound]
bEnabled=1
fVolume=0.8
bBall=1                 ; the roulette ball's sounds (and the wheel's whirr)
fBallVolume=1.0         ; ...how loud, on top of fVolume
bTurnChime=1            ; a chime when it's your turn at the poker or blackjack table, and when blackjack's bets open

[Keys]
iLeave=0x58             ; X
iView=0x56              ; V: the layout or the wheel
iRebet=0x42             ; B: last round's bets again
iClear=0x43             ; C: take your chips back
iPackUp=0x50            ; P: at a table set up from a kit, pack it back into the kit
iTurnLeft=0x51          ; Q: turn the view left at the poker and blackjack tables
iTurnRight=0x45         ; E: ...and right
iLookUp=0x57            ; W: look up at the poker and blackjack tables
iLookDown=0x53          ; S: ...and down
iZoom=0x5A              ; Z: poker, held: zooms in where you look (the ZOOM IN button keeps it)
iChip1=0x31             ; 1
iChip5=0x32             ; 2
iChip25=0x33            ; 3
iChip100=0x34           ; 4

[Forms]
sPlugin=WastelandWagers.esl

[Debug]
bLogTurning=0           ; log what settlers held at a table are doing when they turn ([turn] lines in WastelandWagers.log)
bLogChips=0             ; log the poker table's chips: moves, and anything else moving, hiding or fading them ([chip] lines)
